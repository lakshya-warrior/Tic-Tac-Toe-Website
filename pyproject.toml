[project]
name = "tictactoe-arena"
version = "0.1.0"
description = "Real-time multiplayer Tic-Tac-Toe web application featuring biometric facial recognition authentication and dual-database architecture."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.7",
    "face-recognition>=1.3.0",
    "face-recognition-models",
    "fastapi>=0.135.3",
    "motor>=3.7.1",
    "mysql-connector-python>=9.6.0",
    "numpy>=2.4.3",
    "pillow>=12.1.1",
    "pymongo>=4.16.0",
    "python-multipart>=0.0.24",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "setuptools<71.0",
    "uvicorn[standard]>=0.44.0",
]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
