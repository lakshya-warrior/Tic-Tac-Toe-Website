services:
  mysql-db:
    image: docker.io/library/mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: arena_root
      MYSQL_DATABASE: arena_db
    volumes:
      - ./mysql_data:/var/lib/mysql:Z

  mongo-db:
    image: docker.io/library/mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db:Z
